[project]
name = "ccwc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dingbat-weasel", email = "isaacrperk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ccwc = "ccwc.cli:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "A"]
